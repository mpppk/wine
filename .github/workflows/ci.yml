name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 最小権限。CI は読み取りのみで足りる(依存の postinstall が書き込みトークンを
# 持たないようにする)。terraform 系ワークフローと同一の指定に揃える。
permissions:
  contents: read

# 同一ブランチへの連続 push では古いコミットの run をキャンセルする
# (PR のみ。main への push は履歴として全て走らせる)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Type Check, Lint, Format & Test
    runs-on: ubuntu-latest
    # 既定(360分)のままだと vitest のハング等で最長6時間ランナーを占有する。
    # 通常は数分で終わるジョブなので、余裕を見た上限を明示する。
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # マイグレーション差分検出(下記 Check migrations)がベースブランチとの
          # merge-base を必要とするため全履歴を取得する(fetch-depth:0 で origin/<base> が引ける)。
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # bun のバージョンは package.json の packageManager が唯一の真実の源(#339)。
          # 未指定だと毎回 latest が入り、bun 側のリグレッションでリポジトリ無変更のまま
          # CI とデプロイが同時に壊れうる。Renovate が packageManager の更新PRを出す。
          bun-version-file: package.json

      # bun のパッケージキャッシュ(setup-bun はバイナリのみキャッシュする)。
      # bun.lock が変わらない限りレジストリからの全取得を避ける。
      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # setup-bun は bun-version-file の解決に失敗しても既定(latest)へ**黙って**フォールバックする。
      # 固定が効かなくなったことに気づけるよう、実際に動いている bun を突き合わせる(#339)。
      - name: Verify pinned bun version
        run: |
          bun -e '
            const want = (await Bun.file("package.json").json()).packageManager.replace("bun@", "");
            if (Bun.version !== want) {
              console.error(`bun version mismatch: packageManager=${want} running=${Bun.version}`);
              process.exit(1);
            }
            console.log(`bun ${Bun.version} (pinned via packageManager)`);
          '

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # コミット済みの worker-configuration.d.ts が wrangler.jsonc と揃っているかを見る(#401)。
      # バインディングを足して再生成を忘れると `Env` 型が古いまま **typecheck は緑になり**、
      # 未型付け・存在しないバインディングへのアクセスが実行時まで漏れる。シークレット型
      # (env-secrets.test.ts)・マイグレーション連番(migrations.test.ts)には既にドリフト
      # ガードがあり、この生成物だけ機械的な検査が無かった。
      #
      # Type check より前に置く。型が古いままの typecheck は「緑だが信用できない」状態で、
      # 先に鮮度を見たほうが失敗の意味が明確になる。
      #
      # 再生成して差分を見るのではなく wrangler 自身の --check を使う。前者は wrangler 更新の
      # たびに14,700行の差分が出て原因が読み取れないが、--check は「再生成せよ」と1行で言う。
      # 検査対象は (1) 設定から算出される Env 型のハッシュ (2) workerd バージョンと
      # compatibility_date/flags を含むランタイムヘッダの2つ。したがって **wrangler(workerd)を
      # 上げたPRでも落ちる**が、そのとき生成物は実際に古いので `bun run cf-typegen` を回して
      # コミットするのが正しい。wrangler の更新は automerge から外して人手で見る運用(#263/#402)
      # なので、この失敗はレビュー中のPRに出る。
      #
      # `--env-file=/dev/null` は cf-typegen と揃える(手元の .dev.vars が生成内容に混ざるのを
      # 防ぐ。#261)。これが無いとローカルとCIで判定が食い違う。
      - name: Check generated Worker types are fresh
        run: bun run check:types
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Type check
        run: bun run typecheck

      - name: Lint & Format check (Biome)
        run: bun run check

      # コピペコードの増加を防ぐ。jscpd はトークンベースなので構造が似ただけの
      # コード(Drizzle のテーブル定義・React フォームの hooks 群など)も拾うため、
      # 誤検知の調整は --min-lines / --min-tokens で行う(コメント除外なら --mode weak)。
      # threshold は重複行%で、超過すると exit 1 になる。現状は 1.99% (#507 時点) なので
      # 2.5 から始めて、重複を潰しながら徐々に下げる(ratchet-down)。
      # 生成物(routeTree.gen.ts / worker-configuration.d.ts)は除外する。
      - name: Check duplicate code (jscpd)
        run: bun run check:duplicate

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      # build が通っても deploy で落ちる非互換を検出する(#103: wrangler 単独更新で、
      # 旧 @cloudflare/vite-plugin が生成する dist/server/wrangler.json の legacy_env を
      # 新 CLI が拒否した)。dry-run は生成された設定を実際に読んでバンドル・バインディングを
      # 解決するが、アップロードはしないため認証情報を必要としない。
      # 本番は直前の Build 成果物(dist/)をそのまま検証し、preview は CLOUDFLARE_ENV=preview で
      # 再ビルドしてから検証する(env ごとに vars/バインディングが異なるため)。
      - name: Verify deploy config (production, dry-run)
        run: bun run check:deploy
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Verify deploy config (preview, dry-run)
        run: bun run check:deploy:preview
        env:
          WRANGLER_SEND_METRICS: "false"

      # 手書き連番SQLがゼロから適用可能かを検証する。ローカルの miniflare SQLite に
      # 全マイグレーションを適用し、構文エラー・連番の衝突・migrate 忘れを検出する
      # (リモート認証情報は不要)。
      - name: Verify D1 migrations (local)
        run: bun run db:migrate:local

      # 追加/変更された drizzle/*.sql に破壊的変更(DROP/RENAME/NOT NULL 追加)や冪等性欠如が
      # 無いかを機械的に検出する。expand-and-contract(#24)と冪等性(#54)の運用ルールを
      # レビュー任せにせず強制する(#137)。意図的な破壊的変更は SQL 内の
      # `-- allow-destructive-migration` マーカーでオプトアウトできる。
      #
      # PR だけでなく main への push でも走らせる(#264)。main へ直接入った SQL が
      # 無検査になると、この関門を迂回する経路が残るため。push では直前のコミットと比較する。
      # 差分が取れない場合スクリプトは fail-closed で落ちる(「検査できなかった」が緑にならない)。
      - name: Check migrations (destructive change / idempotency)
        run: bun run check:migrations
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}

name: Terraform

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

# 同一ブランチへの連続 push では古いコミットの plan run をキャンセルする
# (PR のみ。main への push は全て走らせる)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    name: Terraform Validate & Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    # 既定(360分)だと Stripe API の応答待ちで長時間ランナーを占有しうる
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: preview
            # テストモードの Stripe キーを入れる GitHub Secret 名
            stripe_key_secret: STRIPE_TEST_API_KEY
          - env: production
            stripe_key_secret: STRIPE_LIVE_API_KEY
    defaults:
      run:
        working-directory: terraform/${{ matrix.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.4"
          # **wrapper を無効にする**。有効だと terraform コマンドがラッパー経由になり、
          # ラッパーは -detailed-exitcode の exit 2 を「成功」として **0 に握り潰す**
          # (wrapper/terraform.js: `if (exitCode === 0 || exitCode === 2)`)。下の Plan が
          # 差分ありを検知できなくなる(#338 の初回実装がこれで空振りした)。
          terraform_wrapper: false

      - name: Format check
        if: matrix.env == 'preview' # リポジトリ全体に1回で足りる
        run: terraform fmt -check -recursive ..

      # validate は資格情報不要(バックエンドなしで初期化)なので常に実行する
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # secrets コンテキストは if 式で参照できないため、env 経由で有無を判定する。
      # plan は PR では実行しない(下記 Plan の理由参照)ため、PR ではこのステップ自体を
      # スキップして Secrets を PR コンテキストに一切露出させない。
      - name: Check credentials
        id: creds
        if: github.event_name != 'pull_request'
        env:
          R2_ACCESS_KEY: ${{ secrets.TF_R2_ACCESS_KEY_ID }}
          STRIPE_KEY: ${{ secrets[matrix.stripe_key_secret] }}
        run: |
          if [ -n "$R2_ACCESS_KEY" ] && [ -n "$STRIPE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # plan は R2(state) と Stripe の資格情報が必要。Secrets 未設定ならスキップする。
      # Stripe への書き込みは行わない(plan は読み取りのみ)。
      #
      # PR では plan を実行しない: terraform plan は PR ブランチの .tf をそのまま実行するため、
      # provider 差し替えや external data source の追加で live Stripe キー / R2(state)認証情報を
      # 持つプロセスで任意コードが動きうる(#134)。plan は push:main と workflow_dispatch に限定し、
      # PR では fmt / validate(資格情報不要)のみ実行する。
      #
      # **差分ありは緑にしない**(#338)。production の apply は手動 dispatch のみという設計
      # (terraform/README.md: ライブモードの課金リソースを自動 apply しない)は、
      # 「apply 忘れに気づける」ことが前提になっている。素の plan は差分があっても exit 0 で、
      # 結果はログの中にしか残らないため、terraform/ の変更をマージしたあと dispatch を忘れると
      # main と本番 Stripe リソースが恒久的に乖離したまま誰にも通知されない。
      # -detailed-exitcode の exit 2(差分あり)を production では失敗として扱う。
      #
      # preview は push で自動 apply が続けて走るので、差分は通常そのまま解消される。
      # 落とすとノイズになるだけなので warning に留める。
      - name: Plan
        if: github.event_name != 'pull_request' && steps.creds.outputs.available == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_R2_SECRET_ACCESS_KEY }}
          STRIPE_API_KEY: ${{ secrets[matrix.stripe_key_secret] }}
        run: |
          terraform init -reconfigure -input=false
          set +e
          terraform plan -input=false -no-color -detailed-exitcode | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" -eq 1 ]; then
            echo "::error title=Terraform plan (${{ matrix.env }}) が失敗::plan の実行自体が失敗しました。ログを確認してください。"
            exit 1
          fi
          if [ "$code" -eq 0 ]; then
            # 終了コードと出力の突き合わせ。ラッパー等が exit 2 を握り潰すと「差分あり」を
            # 「差分なし」と報告してしまい、この仕組み自体が黙って無効になる(#338)。
            if grep -q "^No changes\." plan.txt; then
              echo "::notice title=Terraform plan (${{ matrix.env }})::差分なし(state と実リソースが一致)。"
              exit 0
            fi
            echo "::error title=plan の終了コードと出力が矛盾::exit 0 だが出力に 'No changes.' がありません。-detailed-exitcode が握り潰されていないか(setup-terraform の terraform_wrapper 等)確認してください。"
            exit 1
          fi

          # 差分あり(exit 2)。job summary には**件数と対象リソースのアドレスだけ**を出す。
          # plan の本文には属性値が含まれ、この provider は webhook シークレット等を
          # sensitive として扱わない(terraform/README.md)。公開リポジトリの run summary へ
          # そのまま貼ると漏洩しうるため、値は載せない。
          {
            echo "### Terraform plan (${{ matrix.env }}): 未適用の差分あり"
            echo
            grep -E "^(Plan|No changes)" plan.txt || true
            echo
            echo "変更対象:"
            echo '```'
            grep -E "^  # " plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ matrix.env }}" = "production" ]; then
            echo "::error title=production に未適用の差分::main と本番 Stripe リソースが乖離しています。Terraform Apply ワークフローを workflow_dispatch で実行してください(terraform/README.md)。"
            exit 1
          fi
          echo "::warning title=preview に未適用の差分::push トリガーの自動 apply が続けて走るため、通常は直後に解消されます。解消しない場合は Terraform Apply の run を確認してください。"

      - name: Plan skipped notice (secrets 未設定)
        if: github.event_name != 'pull_request' && steps.creds.outputs.available != 'true'
        run: |
          echo "::notice title=Terraform plan (${{ matrix.env }}) をスキップ::GitHub Secrets (TF_R2_ACCESS_KEY_ID / TF_R2_SECRET_ACCESS_KEY / ${{ matrix.stripe_key_secret }}) が未設定のため validate のみ実行しました。設定方法は terraform/README.md を参照。"

      - name: Plan skipped notice (PR)
        if: github.event_name == 'pull_request'
        run: |
          echo "::notice title=Terraform plan (${{ matrix.env }}) をスキップ::PR では live 認証情報を PR ブランチのコードに渡さないため plan を実行しません(fmt / validate のみ)。plan は main へのマージ後(push)または手動実行(workflow_dispatch)で確認します。"
